[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fem_1d"
dynamic = ["version"]
description = "1D finite/spectral elements for coupled multi-field weak forms, with adjoints and sensitivity kernels"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["finite elements", "spectral elements", "adjoint", "sensitivity kernels", "geophysics", "Stokes flow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
# scipy >= 1.12 for sparse.diags_array; the core needs nothing else
dependencies = ["numpy>=1.24", "scipy>=1.12"]

[project.urls]
Repository = "https://github.com/ij264/fem_1d"

[project.optional-dependencies]
plot = ["matplotlib"]       # fem_1d.plotting
test = ["pytest", "matplotlib"]
docs = ["sphinx>=7.4", "furo>=2024.8"]

[tool.setuptools.dynamic]
version = {attr = "fem_1d.__version__"}

[tool.setuptools.packages.find]
include = ["fem_1d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
